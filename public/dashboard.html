<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Daily Check-in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div>
        <p class="kicker">Daily Check-in</p>
        <h1 id="welcomeTitle">Your profile</h1>
        <p class="muted" id="lastLogin"></p>
      </div>
      <button id="logoutBtn" class="ghost">Log out</button>
    </header>

    <section class="card-grid single">
      <div class="card">
        <h2>Profile</h2>
        <form id="profileForm" class="stack">
          <label>
            Phone number
            <input type="text" name="phoneNumber" />
          </label>
          <label>
            Telegram chat ID
            <input type="text" name="telegramChatId" />
            <span class="hint">Optional if you link Telegram using the button below.</span>
          </label>
          <button type="submit">Save profile</button>
          <p class="form-note" id="profileMessage"></p>
        </form>
        <div class="link-box">
          <h3>Link Telegram</h3>
          <p class="muted">Generate a one-time code and send it to your bot with <strong>/start CODE</strong>.</p>
          <button id="linkTelegramBtn" class="ghost">Generate link code</button>
          <div class="link-code" id="linkCode"></div>
          <p class="hint" id="linkHint"></p>
          <p class="link-status" id="linkStatus"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="theme.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
